[package]
name = "si-probe"
description = "SpeedImprover data collection: sysinfo everywhere, WMI/registry/DXGI/PDH/NVML on Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
si-core = { path = "../si-core" }
sysinfo = "0.40.3"
serde.workspace = true
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# TLS backend: SChannel on Windows, rustls elsewhere (see ledger pre-flight ruling).
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
wmi = "0.18.4"
winreg = "0.56.0"
nvml-wrapper = "0.13.0"
windows = { version = "0.62.2", features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Restore",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_UpdateAgent",
    "Win32_System_SystemServices",
] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
