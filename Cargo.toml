[workspace]
resolver = "3"
members = ["crates/si-core", "crates/si-probe", "crates/si-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
